name: Refresh animated profile art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-art
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Fetch real public contribution data
        env:
          GITHUB_USERNAME: Rdiaz94
        run: python scripts/fetch_contributions.py
      - name: Render animated SVG heatmap
        run: python scripts/render_heatmap_svg.py
      - name: Generate profile info card
        run: python scripts/make_info_card.py
      - name: Commit generated assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh animated contribution graph [skip ci]"
          file_pattern: "data/contributions.json assets/contrib-heatmap.svg assets/info-card.svg"
